<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen | Assistive Communication</title>
        <link rel="icon" type="image/png" href="IMAGES/Lumenfavicon.png">

    <link rel="stylesheet" href="style.css">
    <style>
        .site-link { color: #464b6b; font: 600 0.9rem "Inter", "Segoe UI", Arial, sans-serif; margin-bottom: 14px; }
        .site-link:hover { color: #171a3f; }
        .site-link:focus-visible { outline: 2px solid #6264b3; outline-offset: 3px; }
    </style>
</head>
           
<body>
    

        <header class="hero-card">
            <div class="hero-copy">
                <a id="site-link" class="site-link" href="index.html" hidden>Back to the Lumen website</a>
                <p class="eyebrow">Assistive communication app</p>
                <div class="hero-visual">
                <img src="IMAGES/Lumenlogo.png" alt="Lumen logo">
            </div>
            <p class="eyebrow"> Version 2.0 </p>
             
           
                    
    <div class="page-shell">

        <section class="demo-card">
           
            <div id="app-root"></div>
        </section>
    </div>

   

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.8/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
    <script src="sketch.js"></script>
    <script>
        // Show the link back to the website in browsers only, so the desktop app never navigates away from the board.
        if (!/Electron/i.test(navigator.userAgent)) {
            document.getElementById("site-link").hidden = false;
        }
    </script>


</body>
</html>
